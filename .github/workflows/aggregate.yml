name: Continuous data aggregation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate new data
        run: python3 scripts/aggregate.py

      - name: Commit new aggregate state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aggregate/ data/sources.json
          git diff --cached --quiet || git commit -m "chore: update aggregated data"
          git push
